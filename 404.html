<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Look Interactive</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%23e6398c' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%236a5cff'/></svg>">
<style>
  :root{ --bg:#08090c; --ink:#f2f4f8; --muted:#9aa3b2; --pink:#e6398c; --accent:#6a5cff;
    --iri:linear-gradient(100deg,#6a5cff,#26d0ce,#e6398c,#ffb454,#6a5cff);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif; --mono:ui-monospace,Menlo,Consolas,monospace; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--ink); overflow:hidden;
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(60% 60% at calc(var(--mx,.5)*100%) 40%, rgba(106,92,255,.18), transparent 70%), var(--bg)}
  .k{font:600 12px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0}
  /* two images interleaved in strips; your pointer is the viewing angle */
  .flip{display:grid; margin:18px 0 0; font-weight:850; letter-spacing:-.05em; line-height:.9; font-size:clamp(90px,24vw,260px); --w:7px}
  .flip span{grid-area:1/1}
  .a{background:var(--iri); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 calc(var(--p,1)*var(--w)),transparent 0 var(--w));
            mask-image:repeating-linear-gradient(90deg,#000 0 calc(var(--p,1)*var(--w)),transparent 0 var(--w))}
  .b{font-family:var(--serif); font-style:italic; font-weight:400; letter-spacing:-.02em; font-size:.42em; align-self:center; color:#fff;
    -webkit-mask-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--p,1)*var(--w)),#000 0 var(--w));
            mask-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--p,1)*var(--w)),#000 0 var(--w))}
  .flip[data-s=a] .b,.flip[data-s=b] .a{visibility:hidden}
  p.s{color:var(--muted); margin:22px auto 0; max-width:40ch}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:30px}
  a.btn{display:inline-flex; gap:8px; align-items:center; text-decoration:none; font-weight:600; font-size:15px; border-radius:999px; padding:12px 20px;
    color:#fff; background:linear-gradient(100deg,var(--accent),var(--pink))}
  a.btn.ghost{background:rgba(255,255,255,.04); border:1px solid #2a3040}
  a.btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <p class="k">404 · page not found</p>
  <div class="flip" id="flip" aria-hidden="true"><span class="a">404</span><span class="b">look again.</span></div>
  <p class="s">This page isn't here — though, as with everything we build, what you see depends on where you look.</p>
  <div class="row"><a class="btn" href="/">Back to the site →</a><a class="btn ghost" href="/demo.html">Try the live lab →</a></div>
</main>
<script>
(function(){
  var f=document.getElementById('flip'), root=document.documentElement;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tx=.5, mx=.5, last=-1e9, side=1, p=1, prev=0;
  addEventListener('pointermove',function(e){ tx=e.clientX/innerWidth; last=performance.now(); },{passive:true});
  (function frame(now){
    if(!reduce&&now-last>2500) tx=.5+.42*Math.sin(now/1600);
    mx+=(tx-mx)*.1; root.style.setProperty('--mx',mx.toFixed(3));
    if(mx<.45) side=1; else if(mx>.55) side=0;
    var step=Math.min(1,(now-(prev||now))/250); prev=now;
    p=side>p?Math.min(side,p+step):Math.max(side,p-step);
    f.style.setProperty('--p',p.toFixed(3)); f.dataset.s=p===1?'a':p===0?'b':'';
    requestAnimationFrame(frame);
  })(performance.now());
})();
</script>
</body>
</html>
